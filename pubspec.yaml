name: wajub_mobile
description: Native Wajub checkout SDK for Flutter — Mobile Money, Stripe, no WebView.
version: 1.6.0
homepage: https://docs.wajub.com/libraries/sdks/flutter
repository: https://github.com/wajubhq/wajub-flutter

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  crypto: ^3.0.3
  device_info_plus: '>=11.0.0 <14.0.0'
  flutter_stripe: ^11.4.0
  flutter_svg: ^2.0.17
  flutter_timezone: '>=4.1.1 <6.0.0'
  http: ^1.2.2
  meta: ^1.15.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.1
  web_socket_channel: '>=2.4.0 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  url_launcher_platform_interface: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/wajub/mobile-money.json
