name: wajub_mobile
description: Native Wajub checkout SDK for Flutter — Mobile Money, Stripe, no WebView.
version: 1.1.1
homepage: https://docs.wajub.com/libraries/sdks/flutter
repository: https://github.com/wajubhq/wajub-flutter

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  meta: ^1.15.0
  flutter_stripe: ^11.4.0
  pusher_channels_flutter: ^2.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
